services:
  postgres:
    image: postgres:16-alpine
    container_name: uno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uno_game}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - uno_postgres_data:/var/lib/postgresql/data

volumes:
  uno_postgres_data:
